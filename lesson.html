<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Lesson</title>
  <link rel="stylesheet" href="./css/base.css">
  <link rel="stylesheet" href="./css/lesson.css">
</head>
<body>
  <div id="top-strip" class="top-strip">載入中...</div>
  <main class="app-shell">
    <header class="page-head">
      <h1 id="lesson-title" class="page-title">教學節次</h1>
      <p id="lesson-sub" class="page-subtitle"></p>
    </header>

    <section class="section">
      <div id="lesson-meta" class="lesson-meta"></div>
      <div id="concept-list"></div>
    </section>

    <div class="lesson-actions">
      <button id="back-btn" class="button secondary" type="button">回課程</button>
      <button id="start-btn" class="button primary" type="button">開始練習</button>
    </div>
  </main>

  <script src="./js/storage.js"></script>
  <script src="./js/learning-log.js"></script>
  <script src="./js/app.js"></script>
  <script>
    function toneClass(card) {
      if (card.tone === 'warn') return 'warn';
      if (card.tone === 'error') return 'error';
      if (card.tone === 'neutral') return 'neutral';
      if (['noun','verb','adj','adv'].includes(card.tone)) return card.tone;
      return 'noun';
    }

    async function init() {
      window.AppCore.registerSW();
      const lessonId = window.AppCore.query('lesson') || 'wh-w1-d1';
      const { index, lesson } = await window.AppCore.loadLessonById(lessonId);
      const lessonSessionId = window.LearningLog?.createId ? window.LearningLog.createId('ses') : `ses_${Date.now()}`;
      const progress = window.StorageAPI.loadProgress();
      window.AppCore.renderTopStrip(progress, index, lesson);

      function writeLessonEvent(event) {
        if (!window.LearningLog?.writeEvent) return Promise.resolve();
        return window.LearningLog.writeEvent({
          session_id: lessonSessionId,
          lesson_id: lesson.lesson_id,
          target_component: lesson.target_component,
          ...event
        }).catch((err) => {
          console.warn('課程學習事件寫入失敗，流程會繼續。', err);
        });
      }

      document.getElementById('lesson-title').textContent = `Week ${lesson.week || 1} / Day ${lesson.day} ${lesson.title}`;
      document.getElementById('lesson-sub').textContent = `類型：${lesson.lesson_type}，目標：${window.AppCore.COMPONENT_LABELS[lesson.target_component] || lesson.target_component}，每題 ${lesson.time_limit_seconds} 秒`;
      document.getElementById('lesson-meta').innerHTML = `
        <span class="badge">Week ${lesson.week || 1}</span>
        <span class="badge">Day ${lesson.day}</span>
        <span class="badge">${lesson.lesson_type}</span>
        <span class="badge">${(lesson.focus_tags || []).slice(0, 2).join(' / ')}</span>
      `;
      document.getElementById('concept-list').innerHTML = lesson.concept.cards.map((card) => `
        <article class="concept-card">
          <h4>${card.title}</h4>
          <div class="formula-box ${toneClass(card)}">${card.html}</div>
        </article>
      `).join('');

      writeLessonEvent({
        event_type: 'lesson_enter',
        zh_message: `你進入 ${lesson.lesson_id} 課程：${lesson.title}。`,
        metadata: {
          week: lesson.week,
          day: lesson.day,
          lesson_type: lesson.lesson_type,
          focus_tags: lesson.focus_tags || []
        }
      });

      document.getElementById('start-btn').addEventListener('click', async () => {
        await writeLessonEvent({
          event_type: 'start_practice',
          zh_message: `你從 ${lesson.lesson_id} 按下開始練習。`,
          metadata: { next_url: `./quiz.html?lesson=${lesson.lesson_id}` }
        });
        location.href = `./quiz.html?lesson=${lesson.lesson_id}`;
      });

      document.getElementById('back-btn').addEventListener('click', () => {
        location.href = './index.html';
      });
    }

    init();
  </script>
</body>
</html>
