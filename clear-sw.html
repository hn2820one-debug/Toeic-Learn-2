<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>清除快取</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 480px; margin: 60px auto; padding: 0 20px; background: #f8faf9; }
    h2   { margin-bottom: 8px; }
    p    { color: #555; font-size: 14px; line-height: 1.7; }
    #status { margin-top: 16px; padding: 14px 16px; border-radius: 10px; background: #f1f5f9; font-size: 14px; min-height: 48px; }
    button { margin-top: 16px; padding: 12px 24px; background: #dc2626; color: #fff;
             border: none; border-radius: 8px; font-size: 15px; cursor: pointer; width: 100%; }
    button:hover { background: #b91c1c; }
    .go-btn { background: #1D9E75; margin-top: 10px; display: none; }
    .go-btn:hover { background: #15705a; }
  </style>
</head>
<body>
  <h2>🔄 清除 Service Worker 快取</h2>
  <p>按下按鈕後，瀏覽器會取消所有 Service Worker 並清除快取，確保你看到最新版本的程式。</p>

  <button id="clear-btn" onclick="clearAll()">清除快取並重新整理</button>
  <button id="go-btn" class="go-btn" onclick="location.href='./index.html'">✅ 完成 — 前往首頁</button>
  <div id="status">準備中…</div>

  <script>
    async function clearAll() {
      const status = document.getElementById('status');
      const clearBtn = document.getElementById('clear-btn');
      clearBtn.disabled = true;
      status.textContent = '正在取消 Service Worker…';

      try {
        // Unregister all service workers
        if ('serviceWorker' in navigator) {
          const regs = await navigator.serviceWorker.getRegistrations();
          await Promise.all(regs.map(r => r.unregister()));
          status.textContent = `已取消 ${regs.length} 個 Service Worker。正在清除快取…`;
        }

        // Delete all caches
        const keys = await caches.keys();
        await Promise.all(keys.map(k => caches.delete(k)));

        status.style.background = '#e8f7f0';
        status.textContent = `✅ 完成！已清除 ${keys.length} 個快取。請按下方按鈕前往首頁（會重新下載最新版本）。`;
        document.getElementById('go-btn').style.display = 'block';
      } catch (err) {
        status.style.background = '#fdecec';
        status.textContent = '❌ 清除失敗：' + err.message;
        clearBtn.disabled = false;
      }
    }

    // Auto-show status on load
    (async () => {
      const regs = 'serviceWorker' in navigator
        ? await navigator.serviceWorker.getRegistrations() : [];
      const cacheKeys = await caches.keys();
      document.getElementById('status').textContent =
        `偵測到 ${regs.length} 個 Service Worker，${cacheKeys.length} 個快取項目。按上方按鈕清除。`;
    })();
  </script>
</body>
</html>
