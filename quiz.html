<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Quiz</title>
  <link rel="stylesheet" href="./css/base.css">
  <link rel="stylesheet" href="./css/quiz.css">
</head>
<body>
  <div id="top-strip" class="top-strip">載入中...</div>
  <main class="app-shell">
    <header class="page-head">
      <h1 id="quiz-title" class="page-title">測驗</h1>
      <p class="page-subtitle">選答案後會鎖定；完成全部題目後才可交卷。</p>
    </header>

    <section class="quiz-head">
      <div class="progress-wrap">
        <strong id="q-progress">Q 1 / 1</strong>
        <div class="progress-bar"><div id="progress-fill" class="progress-fill"></div></div>
      </div>
      <div id="q-dots" class="q-dots"></div>
      <p id="q-status" class="q-status">尚未開始</p>
      <div class="timer-row">
        <span>剩餘時間</span>
        <span id="timer-number" class="timer-number">-</span>
      </div>
      <div class="timer-line"><div id="timer-left" class="timer-left"></div></div>
    </section>

    <section class="quiz-card">
      <div id="start-overlay" class="overlay">
        <button id="start-btn" class="button primary">開始作答</button>
      </div>

      <div id="quiz-scene" class="quiz-meta"></div>
      <p id="quiz-stem" class="quiz-stem"></p>
      <div id="option-grid" class="option-grid"></div>
      <p id="hint-text" class="hint-text"></p>
    </section>

    <section class="quiz-actions">
      <div>
        <button id="prev-btn" class="button secondary" disabled>上一題</button>
        <button id="next-btn" class="button secondary" disabled>下一題</button>
      </div>
      <button id="submit-btn" class="button primary" disabled>尚未完成</button>
    </section>
  </main>

  <script src="./js/storage.js"></script>
  <script src="./js/scorer.js"></script>
  <script src="./js/app.js"></script>
  <script src="./js/quiz-engine.js"></script>
  <script>
    window.AppCore.registerSW();
    window.QuizEngine.initQuiz();
  </script>
</body>
</html>
