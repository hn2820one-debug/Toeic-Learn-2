<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>TOEIC 570 to 750</title>
  <link rel="manifest" href="./manifest.json">
  <link rel="stylesheet" href="./css/base.css">
</head>
<body>
  <div id="top-strip" class="top-strip">載入中...</div>
  <main class="app-shell">
    <header class="page-head">
      <h1 class="page-title">TOEIC 570 → 750</h1>
    </header>

    <section class="section">
      <div class="card" id="student-card"></div>
    </section>

    <section class="section">
      <div id="today-card" class="focus-card"></div>
    </section>

    <section class="section">
      <div id="recent-learning-card" class="card"></div>
    </section>

    <section class="section">
      <div id="week-tabs" class="week-tabs"></div>
      <div id="week-panel" class="card week-panel-card"></div>
    </section>

    <section class="section">
      <div class="page-actions">
        <button class="button secondary" type="button" onclick="location.href='./progress.html'">進度總覽</button>
      </div>
    </section>
  </main>

  <script src="./js/storage.js"></script>
  <script src="./js/learning-log.js"></script>
  <script src="./js/app.js"></script>
  <script>
    function htmlEscape(value) {
      return String(value ?? '').replace(/[&<>"']/g, (c) => (
        { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]
      ));
    }

    function findResult(progress, lessonId) {
      for (const mod of Object.values(progress.modules || {})) {
        if (mod.day_results && mod.day_results[lessonId]) return mod.day_results[lessonId];
      }
      return null;
    }

    function getAllCompletedIds(progress) {
      const ids = new Set();
      Object.values(progress.modules || {}).forEach(m =>
        Object.keys(m.day_results || {}).forEach(id => ids.add(id)));
      return ids;
    }

    function computeStreak(progress) {
      const dates = new Set(
        (progress.session_history || []).map(h => h.date).filter(Boolean)
      );
      const today = new Date();
      let streak = 0;
      for (let i = 0; i <= 365; i++) {
        const d = new Date(today);
        d.setDate(d.getDate() - i);
        const ds = `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
        if (dates.has(ds)) {
          streak++;
        } else if (i === 0) {
          // today not studied yet — don't break
        } else {
          break;
        }
      }
      return streak;
    }

    function renderWeekTabs(index, progress) {
      const weeks = [...new Set(index.lessons.map(l => l.week))].sort((a, b) => a - b);
      const completedIds = getAllCompletedIds(progress);
      const nextLesson = [...index.lessons].sort((a, b) => a.sequence - b.sequence)
        .find(l => !completedIds.has(l.lesson_id));
      let activeWeek = nextLesson?.week ?? weeks[0];

      const tabsEl = document.getElementById('week-tabs');
      tabsEl.innerHTML = weeks.map(w =>
        `<button type="button" class="week-tab${w === activeWeek ? ' active' : ''}" data-week="${w}">W${w}</button>`
      ).join('');

      tabsEl.querySelectorAll('.week-tab').forEach(btn => {
        btn.addEventListener('click', () => {
          activeWeek = Number(btn.dataset.week);
          tabsEl.querySelectorAll('.week-tab').forEach(t =>
            t.classList.toggle('active', Number(t.dataset.week) === activeWeek));
          renderWeekPanel(activeWeek, index, progress);
        });
      });

      renderWeekPanel(activeWeek, index, progress);
    }

    function renderWeekPanel(week, index, progress) {
      const completedIds = getAllCompletedIds(progress);
      const lessons = index.lessons.filter(l => l.week === week).sort((a, b) => a.day - b.day);
      const weekInfo = (index.weekly_plan || []).find(w => w.week === week);
      const panelEl = document.getElementById('week-panel');

      if (!lessons.length) {
        panelEl.innerHTML = '<p class="muted-note">本週課程建設中，敬請期待。</p>';
        return;
      }

      const doneCount = lessons.filter(l => completedIds.has(l.lesson_id)).length;
      const rowsHtml = lessons.map(lesson => {
        const result = findResult(progress, lesson.lesson_id);
        const done = completedIds.has(lesson.lesson_id);
        const dotClass = !done ? 'pending' : (result?.mastery >= 7 ? 'mastered' : 'done');
        const meta = done && result
          ? `${lesson.lesson_type} · 正確率 ${(result.accuracy * 100).toFixed(0)}% · 掌握度 ${result.mastery}/10`
          : `${lesson.lesson_type} · 未開始`;
        return `
          <div class="lesson-row">
            <span class="lesson-row-dot dot-${dotClass}"></span>
            <div class="lesson-row-info">
              <div class="lesson-row-title">${htmlEscape(lesson.title)}</div>
              <div class="lesson-row-meta">${htmlEscape(meta)}</div>
            </div>
            <a href="./lesson.html?lesson=${lesson.lesson_id}"
               class="button ${done ? 'secondary' : 'primary'} small">${done ? '重溫' : '開始'}</a>
          </div>`;
      }).join('');

      panelEl.innerHTML = `
        <div class="week-panel-header">
          <strong>Week ${week}</strong>
          ${weekInfo ? `<span>${htmlEscape(weekInfo.title)}</span>` : ''}
          <span class="week-progress">${doneCount} / ${lessons.length} 完成</span>
        </div>
        <div class="lesson-rows">${rowsHtml}</div>`;
    }

    async function init() {
      window.AppCore.registerSW();
      const progress = window.StorageAPI.loadProgress();
      const index = await window.AppCore.loadIndex();
      window.AppCore.renderTopStrip(progress, index, null);

      const s = progress.student;
      document.getElementById('student-card').innerHTML = `
        <div class="score-grid-2">
          <div>
            <span>起點</span>
            <strong>${s.baseline_score.total}</strong>
            <small>L${s.baseline_score.listening} / R${s.baseline_score.reading}</small>
          </div>
          <div>
            <span>目標</span>
            <strong>${s.target_score}</strong>
            <small>L${s.target_split.listening} / R${s.target_split.reading}</small>
          </div>
        </div>`;

      const completedIds = getAllCompletedIds(progress);
      const nextLesson = [...index.lessons].sort((a, b) => a.sequence - b.sequence)
        .find(l => !completedIds.has(l.lesson_id)) || index.lessons[0];
      document.getElementById('today-card').innerHTML = `
        <div>
          <div class="plan-kicker">Next Session</div>
          <h2>${htmlEscape(nextLesson.title)}</h2>
          <p>Week ${nextLesson.week} / Day ${nextLesson.day} · ${htmlEscape(window.AppCore.COMPONENT_LABELS[nextLesson.target_component] || nextLesson.target_component)} · 每題 ${nextLesson.time_limit_seconds}s</p>
        </div>
        <button class="button primary" type="button" onclick="location.href='./lesson.html?lesson=${nextLesson.lesson_id}'">開始今日課</button>`;

      const latestAttempt = (progress.attempts || []).slice()
        .sort((a, b) => String(b.ended_at_iso || '').localeCompare(String(a.ended_at_iso || '')))[0];
      let summary = null;
      if (window.LearningLog?.getRecentSummary) {
        summary = await window.LearningLog.getRecentSummary();
      }
      const latestWeakness = summary?.latest_weakness_tag
        || latestAttempt?.wrong_tags?.[0]
        || (progress.weaknesses || [])[0]?.tag
        || '尚無';
      const streak = computeStreak(progress);
      document.getElementById('recent-learning-card').innerHTML = `
        <div class="score-grid-3">
          <div><span>今日作答</span><strong>${summary?.question_count || 0}</strong><small>題</small></div>
          <div><span>連續天數</span><strong>${streak}</strong><small>天</small></div>
          <div><span>最新弱點</span><strong class="stat-label-sm">${htmlEscape(latestWeakness)}</strong><small>錯題/timeout</small></div>
        </div>`;

      renderWeekTabs(index, progress);
    }

    init();
  </script>
</body>
</html>
