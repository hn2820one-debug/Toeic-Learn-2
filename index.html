<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>TOEIC 570 to 750</title>
  <link rel="manifest" href="./manifest.json">
  <link rel="stylesheet" href="./css/base.css">
</head>
<body>
  <div id="top-strip" class="top-strip">載入中...</div>
  <main class="app-shell">
    <header class="page-head">
      <h1 class="page-title">TOEIC 570 → 750</h1>
    </header>

    <section class="section">
      <div class="card" id="student-card"></div>
    </section>

    <section class="section">
      <div id="today-card" class="focus-card"></div>
    </section>

    <section class="section">
      <div id="recent-learning-card" class="card"></div>
    </section>

    <section class="section">
      <h2 class="page-subtitle">課程地圖</h2>
      <div id="lesson-map" class="card"></div>
    </section>

    <section class="section">
      <div class="page-actions">
        <button class="button secondary" type="button" onclick="location.href='./progress.html'">進度總覽</button>
      </div>
    </section>
  </main>

  <script src="./js/storage.js"></script>
  <script src="./js/learning-log.js"></script>
  <script src="./js/app.js"></script>
  <script>
    function htmlEscape(value) {
      return String(value ?? '').replace(/[&<>"']/g, (c) => (
        { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]
      ));
    }

    function findResult(progress, lessonId) {
      for (const mod of Object.values(progress.modules || {})) {
        if (mod.day_results && mod.day_results[lessonId]) return mod.day_results[lessonId];
      }
      return null;
    }

    function getAllCompletedIds(progress) {
      const ids = new Set();
      Object.values(progress.modules || {}).forEach(m =>
        Object.keys(m.day_results || {}).forEach(id => ids.add(id)));
      return ids;
    }

    function computeStreak(progress) {
      const dates = new Set(
        (progress.session_history || []).map(h => h.date).filter(Boolean)
      );
      const today = new Date();
      let streak = 0;
      for (let i = 0; i <= 365; i++) {
        const d = new Date(today);
        d.setDate(d.getDate() - i);
        const ds = `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
        if (dates.has(ds)) {
          streak++;
        } else if (i === 0) {
          // today not studied yet — don't break
        } else {
          break;
        }
      }
      return streak;
    }

    function moveTip(e, el) {
      const m = 12;
      const tx = Math.min(e.clientX + m, window.innerWidth - el.offsetWidth - m);
      const ty = Math.max(e.clientY - el.offsetHeight - m, m);
      el.style.left = `${tx}px`;
      el.style.top = `${ty}px`;
    }

    function renderLessonMap(index, progress) {
      const completedIds = getAllCompletedIds(progress);
      const sorted = [...index.lessons].sort((a, b) => (a.sequence || 0) - (b.sequence || 0));
      const nextLesson = sorted.find(l => !completedIds.has(l.lesson_id) && l.file);

      const moduleInfoMap = {};
      (index.modules || []).forEach(m => { moduleInfoMap[m.module_id] = m; });

      const moduleOrder = [];
      const byModule = {};
      index.lessons.forEach(lesson => {
        if (!byModule[lesson.module_id]) {
          moduleOrder.push(lesson.module_id);
          byModule[lesson.module_id] = {};
        }
        const w = lesson.week || 1;
        if (!byModule[lesson.module_id][w]) byModule[lesson.module_id][w] = [];
        byModule[lesson.module_id][w].push(lesson);
      });

      const mapEl = document.getElementById('lesson-map');
      mapEl.innerHTML = `
        <div class="map-legend">
          <span class="map-legend-item"><span class="map-legend-dot" style="background:#fff;border:2px solid #d1d5db"></span>未開始</span>
          <span class="map-legend-item"><span class="map-legend-dot" style="background:var(--accent);box-shadow:0 0 0 2px #d1f5eb"></span>下一堂</span>
          <span class="map-legend-item"><span class="map-legend-dot" style="background:#f59e0b"></span>需加強</span>
          <span class="map-legend-item"><span class="map-legend-dot" style="background:#22c55e"></span>已掌握</span>
          <span class="map-legend-item"><span class="map-legend-dot" style="background:#f1f5f9;border:1.5px dashed #cbd5e1"></span>建設中</span>
        </div>
        ${moduleOrder.map(moduleId => {
          const info = moduleInfoMap[moduleId] || { title: moduleId };
          const weeks = Object.entries(byModule[moduleId]).sort(([a],[b]) => Number(a) - Number(b));
          const weekRows = weeks.map(([week, lessons]) => {
            const dots = [...lessons].sort((a, b) => (a.day||0) - (b.day||0)).map(lesson => {
              const isLocked = !lesson.file;
              const result = findResult(progress, lesson.lesson_id);
              const isDone = completedIds.has(lesson.lesson_id);
              const isNext = lesson.lesson_id === nextLesson?.lesson_id;
              const cls = isLocked ? 'locked'
                        : isDone ? (result?.mastery >= 7 ? 'mastered' : 'needs-work')
                        : (isNext ? 'next' : 'pending');
              const acc  = isDone && result ? `正確率 ${(result.accuracy*100).toFixed(0)}%` : '';
              const mast = isDone && result ? `掌握度 ${result.mastery}/10`
                         : isLocked ? '建設中，即將推出'
                         : isNext ? '下一堂' : '未開始';
              const tip  = htmlEscape(JSON.stringify({
                t: lesson.title,
                w: `Week ${lesson.week} / Day ${lesson.day}`,
                k: lesson.lesson_type,
                a: acc,
                m: mast
              }));
              const typeIcon = lesson.lesson_type === 'test' ? '★'
                             : lesson.lesson_type === 'review' ? '↻'
                             : String(lesson.day);
              const typeLabel = lesson.lesson_type === 'test' ? 'test'
                              : lesson.lesson_type === 'review' ? 'review'
                              : lesson.lesson_type?.slice(0, 4) || '';
              const inner = `<span class="dot-day">${typeIcon}</span><span class="dot-type">${typeLabel}</span>`;
              return isLocked
                ? `<span class="map-dot dot-${cls}" data-tip="${tip}">${inner}</span>`
                : `<a href="./lesson.html?lesson=${lesson.lesson_id}" class="map-dot dot-${cls}" data-tip="${tip}">${inner}</a>`;
            }).join('');
            return `<div class="map-week-row"><span class="map-week-lbl">W${week}</span><div class="map-dots">${dots}</div></div>`;
          }).join('');
          return `<div class="map-module"><div class="map-module-title">${htmlEscape(info.title)}</div>${weekRows}</div>`;
        }).join('')}`;

      let tipEl = document.getElementById('map-tip');
      if (!tipEl) {
        tipEl = document.createElement('div');
        tipEl.id = 'map-tip';
        tipEl.className = 'dot-tooltip';
        tipEl.hidden = true;
        document.body.appendChild(tipEl);
      }
      mapEl.querySelectorAll('.map-dot').forEach(dot => {
        dot.addEventListener('mouseenter', e => {
          try {
            const d = JSON.parse(dot.dataset.tip);
            let html = `<strong>${htmlEscape(d.t)}</strong>`;
            html += `<br><span style="opacity:.75">${htmlEscape(d.w)} · ${htmlEscape(d.k)}</span>`;
            if (d.a) html += `<br>${htmlEscape(d.a)} · ${htmlEscape(d.m)}`;
            else     html += `<br>${htmlEscape(d.m)}`;
            tipEl.innerHTML = html;
            tipEl.hidden = false;
            moveTip(e, tipEl);
          } catch (_) {}
        });
        dot.addEventListener('mousemove', e => moveTip(e, tipEl));
        dot.addEventListener('mouseleave', () => { tipEl.hidden = true; });
      });
    }

    async function init() {
      window.AppCore.registerSW();
      const progress = window.StorageAPI.loadProgress();
      const index = await window.AppCore.loadIndex();
      window.AppCore.renderTopStrip(progress, index, null);

      const s = progress.student;
      document.getElementById('student-card').innerHTML = `
        <div class="score-grid-2">
          <div>
            <span>起點</span>
            <strong>${s.baseline_score.total}</strong>
            <small>L${s.baseline_score.listening} / R${s.baseline_score.reading}</small>
          </div>
          <div>
            <span>目標</span>
            <strong>${s.target_score}</strong>
            <small>L${s.target_split.listening} / R${s.target_split.reading}</small>
          </div>
        </div>`;

      const completedIds = getAllCompletedIds(progress);
      const nextLesson = [...index.lessons].sort((a, b) => a.sequence - b.sequence)
        .find(l => !completedIds.has(l.lesson_id) && l.file) || index.lessons.find(l => l.file);
      document.getElementById('today-card').innerHTML = `
        <div>
          <div class="plan-kicker">Next Session</div>
          <h2>${htmlEscape(nextLesson.title)}</h2>
          <p>Week ${nextLesson.week} / Day ${nextLesson.day} · ${htmlEscape(window.AppCore.COMPONENT_LABELS[nextLesson.target_component] || nextLesson.target_component)} · 每題 ${nextLesson.time_limit_seconds}s</p>
        </div>
        <button class="button primary" type="button" onclick="location.href='./lesson.html?lesson=${nextLesson.lesson_id}'">開始今日課</button>`;

      const latestAttempt = (progress.attempts || []).slice()
        .sort((a, b) => String(b.ended_at_iso || '').localeCompare(String(a.ended_at_iso || '')))[0];
      let summary = null;
      if (window.LearningLog?.getRecentSummary) {
        summary = await window.LearningLog.getRecentSummary();
      }
      const latestWeakness = summary?.latest_weakness_tag
        || latestAttempt?.wrong_tags?.[0]
        || (progress.weaknesses || [])[0]?.tag
        || '尚無';
      const streak = computeStreak(progress);
      document.getElementById('recent-learning-card').innerHTML = `
        <div class="score-grid-3">
          <div><span>今日作答</span><strong>${summary?.question_count || 0}</strong><small>題</small></div>
          <div><span>連續天數</span><strong>${streak}</strong><small>天</small></div>
          <div><span>最新弱點</span><strong class="stat-label-sm">${htmlEscape(latestWeakness)}</strong><small>錯題/timeout</small></div>
        </div>`;

      renderLessonMap(index, progress);
    }

    init();
  </script>
</body>
</html>
